<script type="module">
const $=s=>document.querySelector(s);
const icon=(name)=>`<svg class="ui-ico" aria-hidden="true"><use href="#ico-${name}"></use></svg>`;
function setBtn(id,name,label,active){const b=typeof id==='string'?$('#'+id):id;if(!b)return;b.innerHTML=icon(name)+`<span>${label}</span>`;if(active!==undefined)b.classList.toggle('on',!!active)}
const buttonIcons={tg:'menu',offlineb:'wifi',tour:'book',cam:'switch',dbg:'target',shot:'image',labb:'labels',viewb:'view',segb:'cut',calb:'ruler',recb:'record',stageb:'fullscreen',flipb:'flip',start:'camera'};

const S={sys:'all',look:'x',mode:'full',iso:'all',keep:.25,lens:.18,dbg:false,front:true,labels:true,view:'auto',seg:false,stage:'auto',flip:false};
const minLvl=MOB?1:0;
let M,vis,mods={},del='GPU',lvl=minLvl,dpr=1,stream,touch=null,failed=[],swit=false,errN=0,wl=null,rvfc=false;
let pl=null,plMiss=0,fl=null,flMiss=0,HL=[],hlMiss=0,pd=null,fd=null;
let pp=[],ff=null,HA={R:null,L:null},HC=null,HS=0,g={},VP=[],hl=null,hlT=0,tourOn=false,tourI=0,tourT=0,cardT=0,NOW=0;
let SW=innerWidth,SH=innerHeight;
// الدوران ثلاثي الأبعاد والمعايرة والعرض الخلفي والقناع والتسجيل
let pwy=null,wxsAcc=.5,YAW={c:1,s:0},rWf=.8,WfOK=false,WfN=0,TF=null,BACK=false;
let CAL=null,cal={st:0,t0:0,t1:0,s:null};

// تخزين الموارد التي يجلبها MediaPipe محلياً بعد أول تشغيل متصل بالإنترنت.
let swReady=false;
function offlineInfo(){const el=$('#net');if(!el)return;const secure=window.isSecureContext;const state=navigator.onLine?'متصل':'دون اتصال';el.textContent=(secure?'آمن':'يلزم HTTPS')+' · '+state+' · '+(swReady?'التخزين المحلي مفعّل':'جارٍ تفعيل التخزين');}
if('serviceWorker' in navigator && window.isSecureContext){navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>{swReady=true;offlineInfo()}).catch(()=>{swReady=false;offlineInfo()});navigator.serviceWorker.addEventListener('controllerchange',()=>{swReady=true;offlineInfo()});}
addEventListener('online',offlineInfo);addEventListener('offline',offlineInfo);
async function cacheInfo(){try{const c=await caches.open('xray-runtime-v1');const keys=await c.keys();const shell=await caches.open('xray-shell-v1');const sk=await shell.keys();toast('الموارد المحفوظة: '+keys.length+' مورد خارجي، و'+sk.length+' من ملفات التطبيق. افتح التطبيق مرة متصلة وانتظر اكتمال تحميل النماذج قبل فصل الإنترنت.');}catch(e){toast('التخزين المحلي غير متاح. ثبّت التطبيق من HTTPS وافتحه عبر Chrome.')}}

function layout(){const ww=innerWidth,wh=innerHeight;let w=ww,h=wh;

// ---------- zones ----------
const ZK={neck:[0,11,12],torso:[11,12,23,24],pelvis:[23,24],aR:[12,14],aL:[11,13],fR:[14,16],fL:[13,15],thR:[24,26],thL:[23,25],shR:[26,28],shL:[25,27],ftR:[28,32,30],ftL:[27,31,29]};

const ZN={head:'الرأس',neck:'الرقبة',torso:'الجذع',pelvis:'الحوض',aR:'العضد الأيمن',aL:'العضد الأيسر',fR:'الساعد الأيمن',fL:'الساعد الأيسر',hR:'اليد اليمنى',hL:'اليد اليسرى',thR:'الفخذ الأيمن',thL:'الفخذ الأيسر',shR:'الساق اليمنى',shL:'الساق اليسرى',ftR:'القدم اليمنى',ftL:'القدم اليسرى'};
const GL=[['all','كامل الجسم'],['head','الرأس'],['neck','الرقبة'],['shoulders','الكتفان'],['chest','الصدر'],['abdomen','البطن'],['back','الظهر'],['pelvis','الحوض'],['arms','العضدان'],['forearms','الساعدان'],['hands','اليدان'],['thighs','الفخذان'],['shins','الساقان'],['feet','القدمان']];
GL.forEach(([k,t])=>{const b=document.createElement('button');const zi=k==='all'?'scan':k==='head'?'target':k==='neck'?'view':k==='shoulders'||k==='chest'||k==='abdomen'||k==='back'||k==='pelvis'?'organs':k==='arms'||k==='forearms'||k==='thighs'||k==='shins'?'muscle':k==='hands'?'bones':'scan';setBtn(b,zi,t,k==='all');b.dataset.k=k;b.onclick=()=>{S.iso=k;document.querySelectorAll('#zones button').forEach(x=>x.classList.toggle('on',x.dataset.k==k))};$('#zones').appendChild(b)});

function zones(){
 for(const k in ZK){let m=1,ok=!!pl;if(pl)for(const i of ZK[k]){m=Math.min(m,pl[i].v);if(!inF(pl[i]))ok=false}
  updZ(k,ok&&m>=(Z[k].on?.4:.6))}

 updZ('hR',!!HA.R||(!!pl&&pl[16].v>=.5&&inF(pl[16])));updZ('hL',!!HA.L||(!!pl&&pl[15].v>=.5&&inF(pl[15])));
}

function geom(){const W=cv.width,H=cv.height,vw=vid.videoWidth||1,vh=vid.videoHeight||1,s=Math.max(W/vw,H/vh);g={W,H,vw,vh,s,ox:(W-vw*s)/2,oy:(H-vh*s)/2}}
const P=p=>({x:g.ox+(S.front?1-p.x:p.x)*g.vw*g.s,y:g.oy+p.y*g.vh*g.s,v:p.v});
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mid=(a,b)=>a&&b?{x:(a.x+b.x)/2,y:(a.y+b.y)/2}:null;
const lp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});

$('#shot').onclick=()=>{const t=document.createElement('canvas');t.width=cv.width;t.height=cv.height;const c=t.getContext('2d');c.save();if(S.front){c.translate(t.width,0);c.scale(-1,1)}
 c.drawImage(vid,S.front?t.width-g.ox-g.vw*g.s:g.ox,g.oy,g.vw*g.s,g.vh*g.s);c.restore();c.drawImage(cv,0,0);t.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='xray.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)})};
// ---------- التسجيل ----------
function pickMime(){if(typeof MediaRecorder==='undefined')return null;for(const m of ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4;codecs=avc1','video/mp4'])if(MediaRecorder.isTypeSupported(m))return m;return ''}
$('#recb').onclick=()=>{
 if(recOn){stopRec();return}
 if(recPend){recPend=false;setBtn('recb','record','● تسجيل',false);return}
 const mime=pickMime();if(mime===null||!rc.captureStream){toast('التسجيل غير مدعوم في هذا المتصفح. استخدم زر اللقطة أو سجّل الشاشة من الهاتف.');return}
 recMime=mime;recPend=true;recCd=performance.now()+3000;setBtn('recb','close','إلغاء العدّ',true)};
function beginRec(now){
 recPend=false;
 let rw,rh;if(S.stage==='9:16'){rw=1080;rh=1920}else if(S.stage==='16:9'){rw=1280;rh=720}else{const k=Math.min(1,1280/Math.max(cv.width,cv.height));rw=Math.max(2,Math.round(cv.width*k/2)*2);rh=Math.max(2,Math.round(cv.height*k/2)*2)}
 rc.width=rw;rc.height=rh;
 try{const s=rc.captureStream(30);mr=new MediaRecorder(s,recMime?{mimeType:recMime,videoBitsPerSecond:4000000}:{});chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{const type=(recMime||'video/webm').split(';')[0],ext=type.includes('mp4')?'mp4':'webm',b=new Blob(chunks,{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='xray.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);chunks=[]};
  mr.start(1000);recOn=true;recStart=now;setBtn('recb','stop','■ إيقاف التسجيل',true);$('#rt').style.display='block'}
 catch(e){recOn=false;toast('تعذّر بدء التسجيل على هذا الجهاز.');setBtn('recb','record','● تسجيل',false)}}
function stopRec(){recOn=false;recPend=false;try{mr&&mr.state!=='inactive'&&mr.stop()}catch(e){}setBtn('recb','record','● تسجيل',false);$('#rt').style.display='none'}
function recFrame(now){
 const w=rc.width,h=rc.height,vw=vid.videoWidth||1,vh=vid.videoHeight||1,s=Math.max(w/vw,h/vh),dw=vw*s,dh=vh*s,ox=(w-dw)/2,oy=(h-dh)/2;
 rcx.fillStyle='#000';rcx.fillRect(0,0,w,h);rcx.save();if(S.front){rcx.translate(w,0);rcx.scale(-1,1)}
 rcx.drawImage(vid,S.front?w-ox-dw:ox,oy,dw,dh);rcx.restore();rcx.drawImage(cv,0,0,w,h);
 rcx.font='bold '+Math.round(h*.016)+'px Tajawal';rcx.textAlign='center';rcx.fillStyle='rgba(255,255,255,.75)';rcx.fillText('نموذج تشريحي تعليمي وليس أشعة حقيقية',w/2,h-Math.round(h*.02));
 const sec=Math.floor((now-recStart)/1000);$('#rt').textContent='● تسجيل '+String(sec/60|0).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
 if(sec>=90)stopRec()}
// ---------- render ----------
let fc=0,ft=performance.now(),fps=0,good=0,lastRec='',lastCnt='';
function render(now){
 NOW=now;
 dpr=lvl>=2?1:Math.min(devicePixelRatio||1,1.5);const W=Math.round(SW*dpr),H=Math.round(SH*dpr);
 if(cv.width!=W||cv.height!=H){cv.width=W;cv.height=H}
 geom();cx=cx0;cx.clearRect(0,0,W,H);
 pd=ease(pl?pd:null,pl,.4);fd=ease(fl?fd:null,fl,.5);
 pp=pd?pd.map(P):[];ff=fd?fd.map(P):null;HA={R:null,L:null};
 HL.forEach(h=>{h._d=ease(h._d,h,.5);const hh=h._d.map(P);let side;
  if(pl&&pp[15]&&pp[16]){side=D(hh[0],pp[16])<=D(hh[0],pp[15])?'R':'L';if(HA[side])side=side=='R'?'L':'R'}else side=HA.R?'L':'R';
  if(!HA[side])HA[side]=hh});
 HC=null;HS=0;
 if(ff){HC=mid(ff[10],ff[152]);HS=D(ff[10],ff[152])}
 else if(pl&&pl[7].v>=.4&&pl[8].v>=.4&&pp[7]&&pp[8]){HC=mid(pp[7],pp[8]);HS=D(pp[7],pp[8])*1.5}
 buildTF();
 zones();
 VP=[];for(const p of parts){if((p.view==='b'&&!BACK)||(p.view==='f'&&BACK))continue;let r=null;try{r=p.fn()}catch(e){}if(r&&r[0]&&r[1]>0)VP.push([p,r[0],r[1]])}
 X=S.look=='x';BC=X?'#dff3ff':'#efe6cc';
 let tip=null;for(const s of ['R','L']){if(HA[s])tip=tip||HA[s][8]}
 const lc=touch||tip;
 cx.save();let draw=true;
 if(S.mode=='lens'){if(lc){cx.beginPath();cx.arc(lc.x,lc.y,S.lens*Math.min(W,H),0,6.283);cx.clip()}else draw=false}
 if(S.mode=='scan'){const sy=((now/14)%(H*1.25));cx.beginPath();cx.rect(0,0,W,sy);cx.clip();g.sy=sy}
 if(draw){if(X){cx.fillStyle='rgba(3,12,26,'+(.9*(1-S.keep)+.05)+')';cx.fillRect(0,0,W,H)}
  const clip=S.seg&&maskOK;
  if(clip){if(ac.width!==W||ac.height!==H){ac.width=W;ac.height=H}acx.globalCompositeOperation='source-over';acx.clearRect(0,0,W,H);cx=acx}
  if(X&&lvl==0){cx.shadowColor='#5fd0ff';cx.shadowBlur=7*dpr}
  anat();
  if(clip){cx=cx0;acx.shadowBlur=0;acx.globalCompositeOperation='destination-in';acx.save();if(S.front){acx.translate(W,0);acx.scale(-1,1)}
   acx.drawImage(mc,S.front?W-g.ox-g.vw*g.s:g.ox,g.oy,g.vw*g.s,g.vh*g.s);acx.restore();acx.globalCompositeOperation='source-over';cx.drawImage(ac,0,0)}}
 cx.restore();
 if(S.mode=='lens'&&lc){cx.save();cx.shadowColor='#5fd0ff';cx.shadowBlur=14*dpr;pen('#5fd0ff',3*dpr);cx.beginPath();cx.arc(lc.x,lc.y,S.lens*Math.min(W,H),0,6.283);cx.stroke();cx.restore()}
 if(S.mode=='scan'){cx.save();cx.shadowColor='#5fd0ff';cx.shadowBlur=12*dpr;ln({x:0,y:g.sy},{x:W,y:g.sy},3*dpr,'#9fe6ff');cx.restore()}
 drawLabels(W,H);
 // الإشارة: ثبّت رأس السبابة نحو نصف ثانية فوق جزء
 if(tip){if(!render.t||Math.hypot(tip.x-render.t.x,tip.y-render.t.y)>W*.03){render.t={x:tip.x,y:tip.y};render.s=now;render.d=0}else if(now-render.s>500&&!render.d){const p=hit(tip.x,tip.y,true);if(p)show(p);render.d=1}}
 // الجولة التعليمية
 if(tourOn&&now>tourT){const vp=VP.map(v=>v[0]);if(vp.length){hl=vp[tourI++%vp.length];show(hl,3000);tourT=now+3000}}
 // حلقة التمييز
 if(hl&&now<hlT){const v=VP.find(x=>x[0]==hl);if(v){const pr=1+.15*Math.sin(now/120);cx.save();cx.shadowColor='#ffcf6b';cx.shadowBlur=12*dpr;pen('#ffcf6b',3*dpr);cx.beginPath();cx.arc(v[1].x,v[1].y,Math.max(v[2],14*dpr)*pr,0,6.283);cx.stroke();cx.restore();
   cx.font='bold '+16*dpr+'px Tajawal';cx.fillStyle='#ffcf6b';cx.textAlign='center';cx.fillText(hl.ar,Math.min(Math.max(v[1].x,60*dpr),W-60*dpr),Math.max(v[1].y-Math.max(v[2],14*dpr)*1.3,40*dpr))}}
 else if(now>cardT)$('#card').style.display='none';
 if(S.dbg){cx.font=10*dpr+'px sans-serif';pp.forEach((p,i)=>{cx.fillStyle=p.v>=.5?'#4f4':'#f55';cx.fillRect(p.x-2,p.y-2,5,5);cx.fillText(i+':'+p.v.toFixed(1),p.x+4,p.y)});
  if(ff){cx.fillStyle='#ff0';ff.forEach(p=>cx.fillRect(p.x,p.y,2,2))}['R','L'].forEach(s=>HA[s]&&HA[s].forEach(p=>{cx.fillStyle='#0ff';cx.fillRect(p.x-2,p.y-2,4,4)}));
  if(TF){cx.font='bold '+14*dpr+'px sans-serif';cx.fillStyle='#ff0';cx.textAlign='left';cx.fillText('yaw '+Math.round(Math.atan2(TF.s,TF.c)*180/Math.PI)+'°  Wf='+Math.round(TF.Wf)+(CAL?'  CAL':''),10*dpr,H*.5)}}
 calStep(now,W,H);
 if(recPend){if(now<recCd)banner(String(Math.ceil((recCd-now)/1000)),H*.45,W,H,72);else beginRec(now)}
 if(recOn)recFrame(now);
 // الشارات (تُحدَّث عند التغيّر فقط)
 const names=Object.keys(Z).filter(k=>Z[k].on).map(k=>ZN[k]);if(names.length&&BACK)names.unshift('عرض خلفي');
 const rec=names.length?names.join(' · '):'ابتعد قليلًا أو ارفع يدك أمام الكاميرا';if(rec!==lastRec){lastRec=rec;$('#rec').textContent=rec}
 const cnt='الأجزاء الظاهرة: '+VP.length+' من '+parts.filter(p=>!((p.view==='b'&&!BACK)||(p.view==='f'&&BACK))).length;if(cnt!==lastCnt){lastCnt=cnt;$('#cnt').textContent=cnt}
 fc++;if(now-ft>2000){fps=Math.round(fc*1000/(now-ft));fc=0;ft=now;
  if(fps<18&&lvl<3){lvl++;good=0}else if(fps>28&&lvl>minLvl){if(++good>=3){lvl--;good=0}}else good=0}
 const tr=[mods.face&&fl?'وجه':'',HL.length?'يدان':'',pl?'جسم':''].filter(Boolean).join(' · ');
 stat((tr||'لا يوجد تتبع')+' · '+fps+' إطار/ث · '+del+(lvl>minLvl?' · وضع خفيف':'')+(CAL?' · معايَر':'')+(failed.length?' · تعذّر: '+failed.join('، '):''));
}
function loop(now){fn++;if(!document.hidden){step();render(now)}requestAnimationFrame(loop)}
